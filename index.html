<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFlow</title>

    <link rel="stylesheet" href="css/rezet.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="loadin">
        <div class="containerLoad">
            <div class="nameApp">FinFlow</div>
            <div class="authorApp">by BOGDYK</div>
        </div>
    </div>
    <div class="root">
        <div id="head">
            <div id="logo">
                <span id="logo-name">FinFlow</span>
                <span id="author-name">by BOGDYK</span>
            </div>
            <button id="account">
                <img src="icon/data-user.png" alt="account-image" id="account-image">
            </button>
        </div>
        <div id="body">
            <div id="main">

            </div>
        </div>
        <div id="footer">
            <div id="menu">
                <button class="menuItem activeItem" id="nav-home">
                    <img src="icon/home.svg" alt="home" class="menuImg">
                    <span class="menuText">Главная</span>
                </button>

                <button class="menuItem" id="nav-history">
                    <img src="icon/history.png" alt="history" class="menuImg">
                    <span class="menuText">История</span>
                </button>

                <button class="menuItem" id="nav-stats">
                    <img src="icon/statistics.png" alt="stats" class="menuImg">
                    <span class="menuText">Анализ</span>
                </button>
            </div>

            <div id="new-transaction">
                <div id="containerNewTr">
                    <button id="new-transactionBtn">
                        <img width="40" height="40" src="icon/plus-solid.svg" alt="plus">
                        <span>Добавить</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
